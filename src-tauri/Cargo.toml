[package]
name = "markdown-editor"
version = "1.0.1"
description = "Reevik — a glossy markdown editor with vaults and an AI agent"
authors = ["Erhan Bağdemir"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "markdown_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.103"
base64 = "0.22"
chrono = "0.4.45"
keyring = { version = "4.1.4", features = ["apple-native-keyring-store"] }
tokio = { version = "1.52.3", features = ["full"] }
reqwest = { version = "0.13.4", features = ["json", "rustls"], default-features = false }
window-vibrancy = "0.7.1"
